server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: alerta-enchentes

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/alerta_enchentes}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    token: ${ADMIN_TOKEN:}
  external-apis:
    open-meteo:
      base-url: ${WEATHER_API_URL:https://api.open-meteo.com/v1/forecast}
      latitude: -22.4258
      longitude: -45.4528
      timezone: America/Sao_Paulo
      refresh-interval: ${WEATHER_REFRESH_INTERVAL:PT15M}

  monitoring-points:
    - id: varginha
      bairro: Varginha
      ponto: Rio Sapucaí
      latitude: -22.44
      longitude: -45.45
    - id: medicina
      bairro: Medicina
      ponto: Ribeirão José Pereira
      latitude: -22.42
      longitude: -45.45
    - id: sao-sebastiao
      bairro: São Sebastião
      ponto: Ribeirão Anhumas
      latitude: -22.41
      longitude: -45.43

logging:
  level:
    com.alertaenchentes: INFO
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"