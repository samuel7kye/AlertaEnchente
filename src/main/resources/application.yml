server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: alerta-enchentes

  datasource:
    url: jdbc:postgresql://localhost:5432/alerta_enchentes
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    baseline-description: Initial schema

  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  security:
    user:
      name: admin
      password: ${ADMIN_PASSWORD:admin123}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  admin:
    token: ${ADMIN_TOKEN:alerta-admin-2024}
  external-apis:
    open-meteo:
      base-url: https://api.open-meteo.com/v1/forecast
      latitude: -22.42
      longitude: -45.45
      timezone: America/Sao_Paulo
    ibge:
      base-url: https://servicodados.ibge.gov.br/api/v1

  monitoring-points:
    - id: varginha
      bairro: Varginha
      ponto: Rio Sapucaí
      latitude: -22.44
      longitude: -45.45
    - id: medicina
      bairro: Medicina
      ponto: Ribeirão José Pereira
      latitude: -22.42
      longitude: -45.45
    - id: sao-sebastiao
      bairro: São Sebastião
      ponto: Ribeirão Anhumas
      latitude: -22.41
      longitude: -45.43

logging:
  level:
    com.alertaenchentes: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"